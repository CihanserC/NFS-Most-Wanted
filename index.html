<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080a" />
    <title>Muscle Garage</title>
    <style>
      /* Yükleme ekranı: uygulama paketi inip çizime başlayana kadar anında görünür. */
      html,
      body {
        margin: 0;
        background: #07080a;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 60%, #1a120c 0%, #07080a 70%);
        color: #f2efe8;
        font-family: 'Bahnschrift', 'Arial Narrow', 'Segoe UI', sans-serif;
        transition: opacity 0.45s ease;
      }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-inner {
        text-align: center;
      }
      #boot .boot-title {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        transform: skewX(-8deg);
      }
      #boot .boot-title b {
        color: #ff7a18;
      }
      #boot .boot-sub {
        margin-top: 6px;
        font-size: 13px;
        letter-spacing: 0.4em;
        color: #a9a6a0;
        text-transform: uppercase;
      }
      #boot .boot-bar {
        width: 260px;
        height: 4px;
        margin: 26px auto 0;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
        transform: skewX(-18deg);
      }
      #boot .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #ff7a18;
        box-shadow: 0 0 12px rgba(255, 122, 24, 0.8);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-bar i {
          animation: none;
          width: 100%;
        }
        #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-inner">
        <div class="boot-title">Muscle <b>Garage</b></div>
        <div class="boot-sub" id="boot-sub">Preparing the garage</div>
        <script>
          // Kayıtlı dil Türkçeyse açılış metni de Türkçe (uygulama yüklenmeden önce)
          try {
            if (localStorage.getItem('muscle-garage.locale') === 'tr') {
              document.documentElement.lang = 'tr';
              document.getElementById('boot-sub').textContent = 'Atölye hazırlanıyor';
            }
          } catch (e) {}
        </script>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
